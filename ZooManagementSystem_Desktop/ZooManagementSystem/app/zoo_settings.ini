; Zoo Management System - database connection settings
; Change "server" to the Server name you see in SSMS if it is different.
;   .\SQLEXPRESS          = SQL Server Express on this computer (works on most PCs)
;   localhost             = default SQL Server instance on this computer
;   DESKTOP-XXXX\SQLEXPRESS = a named instance (copy it from SSMS)

[database]
server = .\SQLEXPRESS
database = ZooDB

; Leave empty for Windows Authentication. Fill both for SQL Server Authentication.
username =
password =

; Leave empty to choose the ODBC driver automatically.
odbc_driver =
